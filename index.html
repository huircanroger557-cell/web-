<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi página con Bootstrap</title>

  <!-- 🔗 Enlace a Bootstrap (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 🔗 Enlace a tu propio CSS (opcional) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🧭 Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">

      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
        </ul>

    </div>

  <main class="container my-5 text-center">
    <h1 class="mb-3">Bienvenido a mi página con Bootstrap</h1>
    <p class="lead">Bootstrap te permite crear sitios modernos y responsivos fácilmente.</p>
    <a href="#" class="btn btn-primary">Saber más</a>
  </main>

  <!-- 🦶 Pie de página -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2025 Mi Sitio Web</p>
  </footer>

  <!-- ⚙️ Script de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
